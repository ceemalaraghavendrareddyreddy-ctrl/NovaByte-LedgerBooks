services:
  - type: web
    name: ledgerbooks
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Waitress (serve.py), not the Flask dev server (run.py) — no debug mode,
    # no auto-reloader forking a second process (which would double-run the
    # scheduler), and it respects $PORT the way Render expects.
    startCommand: "python serve.py"
    envVars:
      # Render's native Python runtime ignores runtime.txt (that's Heroku's
      # convention) — this env var is the actual documented way to pin it.
      # Without it, Render defaults to whatever its latest image ships (3.14
      # at the time this was set up), which broke psycopg2-binary's compiled
      # wheel (built against an older CPython C API).
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerbooks-db
          property: connectionString
      # MRA_TaxInvoice_System and the payroll bridge are both configured per-company
      # from inside the app (Settings), not via env vars — nothing else needed here.

databases:
  - name: ledgerbooks-db
    plan: free
    databaseName: ledgerbooks
    user: ledgerbooks
