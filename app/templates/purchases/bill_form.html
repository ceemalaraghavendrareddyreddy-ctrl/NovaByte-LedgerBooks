{% extends "base.html" %}
{% block content %}
<h1>New Bill</h1>
<div class="card">
  <form method="post" id="bill-form">
    <div class="form-row">
      <label>Vendor</label>
      <select name="vendor_id" required>
        <option value="">-- select vendor --</option>
        {% for v in vendors %}
        <option value="{{ v.id }}" {% if form.vendor_id|string == v.id|string %}selected{% endif %}>{{ v.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label>Vendor's Bill Ref</label>
      <input type="text" name="vendor_ref" value="{{ form.vendor_ref or '' }}" placeholder="their invoice number">
    </div>
    <div class="form-row">
      <label>Bill Date</label>
      <input type="date" name="bill_date" required value="{{ form.bill_date or today }}">
    </div>
    <div class="form-row">
      <label>Due Date</label>
      <input type="date" name="due_date" required value="{{ form.due_date or today }}">
    </div>
    <div class="form-row">
      <label>VAT Rate %</label>
      <input type="number" step="0.01" name="vat_rate" value="{{ form.vat_rate or 15.00 }}" style="max-width:100px;">
    </div>
    <div class="form-row">
      <label>Currency</label>
      <select name="currency" id="currency-select" style="max-width:120px;">
        {% for c in currencies %}
        <option value="{{ c }}" {% if (form.currency or base_currency) == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row" id="exchange-rate-row" style="display:none;">
      <label>Exchange Rate <span style="font-weight:normal; color:var(--muted);">(1 unit = ? {{ base_currency }})</span></label>
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <input type="number" step="0.000001" name="exchange_rate" id="exchange-rate-input" value="{{ form.exchange_rate or 1.0 }}" style="max-width:140px;">
        <button type="button" class="btn small secondary" id="fetch-rate-btn">Get today's rate</button>
        <span class="text-muted" id="fetch-rate-status" style="font-size:0.78rem;"></span>
      </div>
    </div>
    <div class="form-row">
      <label>Memo</label>
      <input type="text" name="memo" value="{{ form.memo or '' }}">
    </div>

    <table class="journal-lines-table">
      <thead>
        <tr><th>Item</th><th>Description</th><th class="num">Qty</th><th class="num">Unit Price</th><th>Expense/Asset Account</th><th>Taxable</th><th>VAT %</th><th></th></tr>
      </thead>
      <tbody id="lines-body">
        <tr>
          <td>
            <select class="item-select">
              <option value="">-- manual line --</option>
              {% for it in items %}
              {% if it.is_tracked %}
              <option value="{{ it.id }}">{{ it.sku }} - {{ it.name }} (avg cost {{ '%.2f'|format(it.cost_price) }})</option>
              {% endif %}
              {% endfor %}
            </select>
            <input type="hidden" name="item_id" class="item-id-input" value="">
          </td>
          <td><input type="text" name="description"></td>
          <td><input type="number" step="0.01" name="quantity" class="qty-input" value="1"></td>
          <td><input type="number" step="0.01" name="unit_price" class="price-input"></td>
          <td>
            <select name="expense_account_id" class="account-select">
              {% for a in expense_accounts %}
              <option value="{{ a.id }}" {% if default_expense and a.id == default_expense.id %}selected{% endif %}>{{ a.code }} - {{ a.name }}</option>
              {% endfor %}
            </select>
          </td>
          <td style="text-align:center;"><input type="checkbox" name="taxable" value="0" checked></td>
          <td style="min-width:110px;">
            <select class="line-vat-select" style="width:100%;" title="Blank = use the bill's own VAT rate above">
              <option value="">Bill rate</option>
              {% for v in range(0, 16) %}<option value="{{ v }}">{{ v }}%</option>{% endfor %}
              <option value="custom">Custom</option>
            </select>
            <input type="number" step="0.01" class="line-vat-custom" style="width:100%; display:none; margin-top:2px;" placeholder="%">
            <input type="hidden" name="line_vat_rate" class="line-vat-hidden" value="">
          </td>
          <td><button type="button" class="btn small secondary remove-line">✕</button></td>
        </tr>
      </tbody>
    </table>
    <button type="button" class="btn small secondary" id="add-line">+ Add Line</button>

    <div class="stat-row" style="margin-top:1rem;">
      <div class="stat"><div class="label">Subtotal</div><div class="value" id="subtotal">0.00</div></div>
      <div class="stat"><div class="label">VAT</div><div class="value" id="vat-amount">0.00</div></div>
      <div class="stat"><div class="label">Total</div><div class="value" id="total">0.00</div></div>
      <div class="stat" id="total-base-stat" style="display:none;">
        <div class="label">Total ({{ base_currency }})</div><div class="value" id="total-base">0.00</div>
      </div>
    </div>

    <div style="margin-top:1rem;">
      <button class="btn" type="submit">Save & Post Bill</button>
      <a class="btn secondary" href="{{ url_for('purchases.bill_list') }}">Cancel</a>
    </div>
  </form>
</div>

<script>
const ITEMS = {
  {% for it in items %}
  {% if it.is_tracked %}
  "{{ it.id }}": {
    name: {{ it.name|tojson }}, cost: {{ it.cost_price }}, inventoryAccountId: "{{ it.inventory_account_id }}",
    vatRate: {{ 'null' if it.default_vat_rate is none else it.default_vat_rate }}
  },
  {% endif %}
  {% endfor %}
};

function syncLineVat(row) {
  const select = row.querySelector('.line-vat-select');
  const custom = row.querySelector('.line-vat-custom');
  const hidden = row.querySelector('.line-vat-hidden');
  if (select.value === 'custom') { custom.style.display = ''; hidden.value = custom.value; }
  else { custom.style.display = 'none'; hidden.value = select.value; }
  recalcTotals();
}
function setLineVat(row, rate) {
  const select = row.querySelector('.line-vat-select');
  const custom = row.querySelector('.line-vat-custom');
  const hidden = row.querySelector('.line-vat-hidden');
  if (rate === null || rate === undefined) { select.value = ''; custom.style.display = 'none'; hidden.value = ''; return; }
  const match = Array.from(select.options).find(o => o.value !== '' && o.value !== 'custom' && parseFloat(o.value) === parseFloat(rate));
  if (match) { select.value = match.value; custom.style.display = 'none'; hidden.value = match.value; }
  else { select.value = 'custom'; custom.value = rate; custom.style.display = ''; hidden.value = rate; }
}

const linesBody = document.getElementById('lines-body');
const rowTemplate = linesBody.querySelector('tr').cloneNode(true);

function reindexCheckboxes() {
  linesBody.querySelectorAll('tr').forEach((row, i) => {
    row.querySelector('input[name=taxable]').value = i;
  });
}

function clearRowInputs(row) {
  row.querySelectorAll('input[type=text], input[type=number]').forEach(i => i.value = '');
  row.querySelector('.qty-input').value = 1;
  row.querySelector('input[type=checkbox]').checked = true;
  row.querySelector('.item-select').selectedIndex = 0;
  row.querySelector('.item-id-input').value = '';
  setLineVat(row, null);
}

function onItemSelect(row) {
  // Note: the account <select> is deliberately never `disabled` here — a disabled field
  // is excluded from form submission entirely, which would desync the positional
  // zip() of per-row fields on the server. We just set its value; the server ignores
  // it anyway and uses the item's own inventory account whenever item_id is set.
  const select = row.querySelector('.item-select');
  const item = ITEMS[select.value];
  row.querySelector('.item-id-input').value = select.value || '';
  const accountSelect = row.querySelector('.account-select');
  if (item) {
    row.querySelector('input[name=description]').value = item.name;
    row.querySelector('.price-input').value = item.cost;
    if (accountSelect.querySelector(`option[value="${item.inventoryAccountId}"]`)) {
      accountSelect.value = item.inventoryAccountId;
    }
    setLineVat(row, item.vatRate);
  }
  recalcTotals();
}

const BASE_CURRENCY = {{ base_currency|tojson }};

function updateCurrencyUI() {
  const isForeign = document.getElementById('currency-select').value !== BASE_CURRENCY;
  document.getElementById('exchange-rate-row').style.display = isForeign ? '' : 'none';
  document.getElementById('total-base-stat').style.display = isForeign ? '' : 'none';
  recalcTotals();
}

function recalcTotals() {
  let subtotal = 0, vat = 0;
  const vatRate = parseFloat(document.querySelector('input[name=vat_rate]').value) || 0;
  linesBody.querySelectorAll('tr').forEach(row => {
    const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
    const price = parseFloat(row.querySelector('.price-input').value) || 0;
    const amount = qty * price;
    subtotal += amount;
    if (row.querySelector('input[type=checkbox]').checked) {
      const lineVatRaw = row.querySelector('.line-vat-hidden').value;
      const lineRate = lineVatRaw !== '' ? parseFloat(lineVatRaw) : vatRate;
      vat += amount * (lineRate || 0) / 100;
    }
  });
  const total = subtotal + vat;
  document.getElementById('subtotal').textContent = subtotal.toFixed(2);
  document.getElementById('vat-amount').textContent = vat.toFixed(2);
  document.getElementById('total').textContent = total.toFixed(2);

  const isForeign = document.getElementById('currency-select').value !== BASE_CURRENCY;
  if (isForeign) {
    const rate = parseFloat(document.getElementById('exchange-rate-input').value) || 0;
    document.getElementById('total-base').textContent = (total * rate).toFixed(2);
  }
}

document.getElementById('add-line').addEventListener('click', () => {
  const row = rowTemplate.cloneNode(true);
  clearRowInputs(row);
  linesBody.appendChild(row);
  reindexCheckboxes();
});

linesBody.addEventListener('click', (e) => {
  if (e.target.classList.contains('remove-line')) {
    if (linesBody.querySelectorAll('tr').length > 1) {
      e.target.closest('tr').remove();
      reindexCheckboxes();
      recalcTotals();
    }
  }
});

linesBody.addEventListener('change', (e) => {
  if (e.target.classList.contains('item-select')) {
    onItemSelect(e.target.closest('tr'));
  } else if (e.target.classList.contains('line-vat-select')) {
    syncLineVat(e.target.closest('tr'));
  }
});

linesBody.addEventListener('input', (e) => {
  if (e.target.classList.contains('line-vat-custom')) syncLineVat(e.target.closest('tr'));
  else recalcTotals();
});
document.querySelector('input[name=vat_rate]').addEventListener('input', recalcTotals);
document.getElementById('currency-select').addEventListener('change', updateCurrencyUI);
document.getElementById('exchange-rate-input').addEventListener('input', recalcTotals);

document.getElementById('fetch-rate-btn').addEventListener('click', async () => {
  const statusEl = document.getElementById('fetch-rate-status');
  const from = document.getElementById('currency-select').value;
  statusEl.textContent = 'Fetching…';
  try {
    const r = await fetch(`/api/fx-rate?from=${encodeURIComponent(from)}&to=${encodeURIComponent(BASE_CURRENCY)}`);
    const data = await r.json();
    if (!r.ok) { statusEl.textContent = data.error || 'Could not fetch a rate.'; return; }
    document.getElementById('exchange-rate-input').value = data.rate;
    statusEl.textContent = `${data.rate} as of ${data.as_of || 'today'} — check and adjust if needed.`;
    recalcTotals();
  } catch (e) {
    statusEl.textContent = 'Could not reach the rate source — enter it manually.';
  }
});

reindexCheckboxes();
updateCurrencyUI();
</script>
{% endblock %}
