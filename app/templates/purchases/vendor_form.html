{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit Vendor' if editing else 'New Vendor' }}</h1>
<div class="card" style="max-width:600px;">
  <form method="post" action="{{ action_url }}">
    <div class="form-row">
      <label>Vendor Type</label>
      <select name="vendor_type" id="vendor-type-select">
        <option value="company" {% if (form.vendor_type or 'company') == 'company' %}selected{% endif %}>Company</option>
        <option value="individual" {% if form.vendor_type == 'individual' %}selected{% endif %}>Individual</option>
      </select>
    </div>
    <div class="form-row"><label>Name</label><input type="text" name="name" required value="{{ form.name or '' }}"></div>
    <div class="form-row"><label>Email</label><input type="email" name="email" value="{{ form.email or '' }}"></div>
    <div class="form-row"><label>Phone</label><input type="text" name="phone" value="{{ form.phone or '' }}"></div>
    <div class="form-row"><label>Phone 2</label><input type="text" name="phone2" value="{{ form.phone2 or '' }}"></div>
    <div class="form-row"><label>Address</label><textarea name="address" rows="2">{{ form.address or '' }}</textarea></div>
    <div class="form-row"><label>Billing Currency</label>
      <select name="billing_currency" style="max-width:120px;">
        {% for c in currencies %}
        <option value="{{ c }}" {% if (form.billing_currency or 'MUR') == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div id="company-fields" style="{{ 'display:none;' if form.vendor_type == 'individual' else '' }}">
      <div class="form-row"><label>VAT Number</label><input type="text" name="vat_number" value="{{ form.vat_number or '' }}"></div>
      <div class="form-row"><label>BRN</label><input type="text" name="brn" value="{{ form.brn or '' }}"></div>
      <div class="form-row"><label>MRA Supplier ID</label><input type="text" name="mra_supplier_id" value="{{ form.mra_supplier_id or '' }}"></div>
      <p style="color:var(--text-muted); font-size:0.8rem; margin:-0.6rem 0 1rem;">
        BRN and MRA Supplier ID are only used on the Statement of Goods and Services export
        (Reports → Statement of Goods &amp; Services) — leave blank if you don't file that with MRA.
      </p>
    </div>
    <div class="form-row"><label>Opening Balance</label><input type="number" step="0.01" name="opening_balance" value="{{ form.opening_balance or 0 }}"></div>
    <button class="btn" type="submit">{{ 'Save Changes' if editing else 'Save Vendor' }}</button>
    <a class="btn secondary" href="{{ url_for('purchases.vendor_list') }}">Cancel</a>
  </form>
</div>

<script>
document.getElementById('vendor-type-select').addEventListener('change', function () {
  document.getElementById('company-fields').style.display = this.value === 'individual' ? 'none' : '';
});
</script>
{% endblock %}
