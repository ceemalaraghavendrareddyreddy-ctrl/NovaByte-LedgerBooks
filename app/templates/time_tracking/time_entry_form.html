{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit Time Entry' if editing else 'Log Time' }}</h1>
<div class="card" style="max-width:600px;">
  <form method="post">
    <div class="form-row"><label>Date</label><input type="date" name="entry_date" required value="{{ form.entry_date or today }}"></div>
    <div class="form-row"><label>Description</label><input type="text" name="description" required value="{{ form.description or '' }}" placeholder="e.g. Website redesign - homepage layout"></div>
    <div class="form-row"><label>Customer (optional)</label>
      <select name="customer_id">
        <option value="">-- none / internal --</option>
        {% for c in customers %}
        <option value="{{ c.id }}" {% if form.customer_id|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    {% if projects %}
    <div class="form-row"><label>Project (optional)</label>
      <select name="project_id">
        <option value="">-- none --</option>
        {% for p in projects %}
        <option value="{{ p.id }}" {% if form.project_id|string == p.id|string %}selected{% endif %}>{{ p.name }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}
    <div class="form-row"><label>Hours</label><input type="number" step="0.01" name="hours" required value="{{ form.hours or '' }}" style="max-width:120px;"></div>
    <div class="form-row"><label>Hourly Rate</label><input type="number" step="0.01" name="hourly_rate" value="{{ form.hourly_rate or 0 }}" style="max-width:140px;"></div>
    <div class="form-row">
      <label>Billable</label>
      <label style="flex:1; min-width:auto; font-weight:normal;">
        <input type="checkbox" name="is_billable" {{ 'checked' if form.get('is_billable', True) else '' }}>
        Can be pulled onto an invoice for this customer
      </label>
    </div>
    <button class="btn" type="submit">{{ 'Save Changes' if editing else 'Save Time Entry' }}</button>
    <a class="btn secondary" href="{{ url_for('time_tracking.time_entry_list') }}">Cancel</a>
  </form>
</div>
{% endblock %}
