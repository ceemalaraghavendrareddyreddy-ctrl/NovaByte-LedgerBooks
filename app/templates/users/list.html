{% extends "base.html" %}
{% block content %}
<h1>Users</h1>
<a class="btn" href="{{ url_for('users.user_new') }}">+ New User</a>

<div class="card">
  <table>
    <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.name }}</td>
        <td>{{ u.username }}</td>
        <td><span class="badge {{ 'debit' if u.role == 'owner' else '' }}">{{ u.role }}</span></td>
        <td>{% if u.is_active_user %}<span class="badge debit">Active</span>{% else %}<span class="badge">Inactive</span>{% endif %}</td>
        <td>
          <a class="btn small secondary" href="{{ url_for('users.user_edit', user_id=u.id) }}">Edit</a>
          {% if u.id != current_user.id %}
          <form class="inline" method="post" action="{{ url_for('users.user_toggle', user_id=u.id) }}">
            <button class="btn small secondary" type="submit">{{ 'Deactivate' if u.is_active_user else 'Activate' }}</button>
          </form>
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
