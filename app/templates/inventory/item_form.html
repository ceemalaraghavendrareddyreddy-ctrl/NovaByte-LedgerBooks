{% extends "base.html" %}
{% block content %}
<h1>New Item</h1>
<div class="card" style="max-width:640px;">
  <form method="post" id="item-form">
    <div class="form-row"><label>SKU</label><input type="text" name="sku" required value="{{ form.sku or '' }}" placeholder="e.g. FAB-001"></div>
    <div class="form-row"><label>Name</label><input type="text" name="name" required value="{{ form.name or '' }}"></div>
    <div class="form-row">
      <label>Type</label>
      <select name="item_type" id="item_type" required>
        {% for t in item_types %}
        <option value="{{ t }}" {% if form.item_type == t %}selected{% endif %}>{{ t.replace('_',' ')|title }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row"><label>Unit</label><input type="text" name="unit" value="{{ form.unit or 'pcs' }}" style="max-width:100px;"></div>
    <div class="form-row"><label>Sales Price</label><input type="number" step="0.01" name="sales_price" value="{{ form.sales_price or 0 }}"></div>
    <div class="form-row"><label>Income Account</label>
      <select name="income_account_id" required>
        {% for a in income_accounts %}
        <option value="{{ a.id }}" {% if defaults.income_account_id and a.id == defaults.income_account_id.id %}selected{% endif %}>{{ a.code }} - {{ a.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div id="inventory-fields">
      <h3 class="section-title">Stock Tracking</h3>
      <div class="form-row"><label>Inventory Account</label>
        <select name="inventory_account_id">
          {% for a in inventory_accounts %}
          <option value="{{ a.id }}" {% if defaults.inventory_account_id and a.id == defaults.inventory_account_id.id %}selected{% endif %}>{{ a.code }} - {{ a.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-row"><label>COGS Account</label>
        <select name="cogs_account_id">
          {% for a in expense_accounts %}
          <option value="{{ a.id }}" {% if defaults.cogs_account_id and a.id == defaults.cogs_account_id.id %}selected{% endif %}>{{ a.code }} - {{ a.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-row"><label>Opening Quantity</label><input type="number" step="0.001" name="opening_quantity" value="{{ form.opening_quantity or 0 }}"></div>
      <div class="form-row"><label>Opening Cost/Unit</label><input type="number" step="0.0001" name="opening_cost" value="{{ form.opening_cost or 0 }}"></div>
      <div class="form-row"><label>Reorder Level</label><input type="number" step="0.001" name="reorder_level" value="{{ form.reorder_level or 0 }}"></div>
    </div>

    <button class="btn" type="submit">Save Item</button>
    <a class="btn secondary" href="{{ url_for('inventory.item_list') }}">Cancel</a>
  </form>
</div>

<script>
function toggleInventoryFields() {
  const isInventory = document.getElementById('item_type').value === 'inventory';
  document.getElementById('inventory-fields').style.display = isInventory ? 'block' : 'none';
}
document.getElementById('item_type').addEventListener('change', toggleInventoryFields);
toggleInventoryFields();
</script>
{% endblock %}
