{% extends "base.html" %}
{% block title %}Sign in · LedgerBooks{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand">
    <span class="brand-logo">LB</span>
    <span class="auth-brand-title">LedgerBooks</span>
  </div>
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-sub">Sign in to continue managing your books.</p>
  <form method="post">
    <div class="auth-field">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" required autofocus autocomplete="username">
    </div>
    <div class="auth-field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <div class="auth-footer">
    New to LedgerBooks? <a href="{{ url_for('auth.register') }}">Create a company account</a>
  </div>
</div>
{% endblock %}
