{% extends "base.html" %}
{% block content %}
<h1>Edit Project</h1>
<div class="card" style="max-width:500px;">
  <form method="post">
    <div class="form-row"><label>Name</label><input type="text" name="name" required value="{{ project.name }}"></div>
    <button class="btn" type="submit">Save Changes</button>
    <a class="btn secondary" href="{{ url_for('projects.project_list') }}">Cancel</a>
  </form>
</div>
{% endblock %}
