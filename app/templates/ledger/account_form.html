{% extends "base.html" %}
{% block content %}
<h1>New Account</h1>
<div class="card" style="max-width:600px;">
  <form method="post">
    <div class="form-row">
      <label>Code</label>
      <input type="text" name="code" required value="{{ form.code or '' }}" placeholder="e.g. 1000">
    </div>
    <div class="form-row">
      <label>Name</label>
      <input type="text" name="name" required value="{{ form.name or '' }}" placeholder="e.g. Cash at Bank">
    </div>
    <div class="form-row">
      <label>Type</label>
      <select name="account_type" id="account-type-select" required>
        {% for t in account_types %}
        <option value="{{ t }}" {% if form.account_type == t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label>Subtype</label>
      <input type="text" name="subtype" id="subtype-input" value="{{ form.subtype or '' }}" placeholder="e.g. Current Asset (optional)">
    </div>
    <div class="form-row">
      <label>Parent Account</label>
      <select name="parent_id">
        <option value="">-- none --</option>
        {% for a in accounts %}
        <option value="{{ a.id }}" {% if form.parent_id == a.id|string %}selected{% endif %}>{{ a.code }} - {{ a.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label>Opening Balance</label>
      <input type="number" step="0.01" name="opening_balance" value="{{ form.opening_balance or 0 }}">
    </div>

    <div id="bank-fields" style="display:none;">
      <div class="form-row"><label>Bank Name</label><input type="text" name="bank_name" value="{{ form.bank_name or '' }}" placeholder="e.g. MCB, SBM"></div>
      <div class="form-row"><label>Account Number</label><input type="text" name="account_number" value="{{ form.account_number or '' }}"></div>
      <div class="form-row"><label>Currency</label>
        <select name="currency" style="max-width:120px;">
          {% for c in currencies %}
          <option value="{{ c }}" {% if (form.currency or 'MUR') == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-row">
      <label>Description</label>
      <textarea name="description" rows="2">{{ form.description or '' }}</textarea>
    </div>
    <button class="btn" type="submit">Save Account</button>
    <a class="btn secondary" href="{{ url_for('ledger.account_list') }}">Cancel</a>
  </form>
</div>

<script>
function updateBankFieldsVisibility() {
  const type = document.getElementById('account-type-select').value;
  const subtype = document.getElementById('subtype-input').value;
  document.getElementById('bank-fields').style.display =
    (type === 'Asset' && subtype === 'Cash and Cash Equivalents') ? '' : 'none';
}
document.getElementById('account-type-select').addEventListener('change', updateBankFieldsVisibility);
document.getElementById('subtype-input').addEventListener('input', updateBankFieldsVisibility);
updateBankFieldsVisibility();
</script>
{% endblock %}
