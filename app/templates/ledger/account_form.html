{% extends "base.html" %}
{% block content %}
<h1>New Account</h1>
<div class="card" style="max-width:600px;">
  <form method="post">
    <div class="form-row">
      <label>Code</label>
      <input type="text" name="code" required value="{{ form.code or '' }}" placeholder="e.g. 1000">
    </div>
    <div class="form-row">
      <label>Name</label>
      <input type="text" name="name" required value="{{ form.name or '' }}" placeholder="e.g. Cash at Bank">
    </div>
    <div class="form-row">
      <label>Type</label>
      <select name="account_type" required>
        {% for t in account_types %}
        <option value="{{ t }}" {% if form.account_type == t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label>Subtype</label>
      <input type="text" name="subtype" value="{{ form.subtype or '' }}" placeholder="e.g. Current Asset (optional)">
    </div>
    <div class="form-row">
      <label>Parent Account</label>
      <select name="parent_id">
        <option value="">-- none --</option>
        {% for a in accounts %}
        <option value="{{ a.id }}" {% if form.parent_id == a.id|string %}selected{% endif %}>{{ a.code }} - {{ a.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label>Opening Balance</label>
      <input type="number" step="0.01" name="opening_balance" value="{{ form.opening_balance or 0 }}">
    </div>
    <div class="form-row">
      <label>Description</label>
      <textarea name="description" rows="2">{{ form.description or '' }}</textarea>
    </div>
    <button class="btn" type="submit">Save Account</button>
    <a class="btn secondary" href="{{ url_for('ledger.account_list') }}">Cancel</a>
  </form>
</div>
{% endblock %}
