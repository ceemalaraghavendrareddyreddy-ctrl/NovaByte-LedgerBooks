{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:3rem auto;">
  <h2>📒 Create your LedgerBooks account</h2>
  <p style="color:var(--muted);font-size:0.9rem;">Sets up a brand new company with its own Chart of Accounts, and makes you its owner.</p>
  <form method="post">
    <div class="form-row" style="flex-direction:column;align-items:stretch;">
      <label>Business Name</label>
      <input type="text" name="business_name" required autofocus>
      <label>Your Name</label>
      <input type="text" name="name" required>
      <label>Username</label>
      <input type="text" name="username" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <label>Confirm Password</label>
      <input type="password" name="confirm_password" required>
    </div>
    <button class="btn" type="submit">Create Company</button>
  </form>
  <p style="margin-top:1rem;"><a href="{{ url_for('auth.login') }}">Already have an account? Log in</a></p>
</div>
{% endblock %}
