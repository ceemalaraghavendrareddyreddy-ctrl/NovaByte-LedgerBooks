{% extends "base.html" %}
{% block title %}Create account · LedgerBooks{% endblock %}
{% block content %}
<div class="auth-card" style="max-width:440px;">
  <div class="auth-brand">
    <span class="brand-logo">LB</span>
    <span class="auth-brand-title">LedgerBooks</span>
  </div>
  <h1 class="auth-title">Create your company</h1>
  <p class="auth-sub">We'll set up a fresh Chart of Accounts and make you its owner.</p>
  <form method="post">
    <div class="auth-field">
      <label for="business_name">Business name</label>
      <input id="business_name" type="text" name="business_name" required autofocus>
    </div>
    <div class="auth-field">
      <label for="name">Your name</label>
      <input id="name" type="text" name="name" required>
    </div>
    <div class="auth-field">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" required autocomplete="username">
    </div>
    <div class="auth-field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="new-password">
    </div>
    <div class="auth-field">
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" type="password" name="confirm_password" required autocomplete="new-password">
    </div>
    <button class="btn primary" type="submit">Create company</button>
  </form>
  <div class="auth-footer">
    Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
  </div>
</div>
{% endblock %}
