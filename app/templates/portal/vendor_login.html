{% extends "base.html" %}
{% block title %}Vendor Portal · LedgerBooks{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand">
    <span class="brand-logo">LB</span>
    <span class="auth-brand-title">Vendor Portal</span>
  </div>
  <h1 class="auth-title">View your bills</h1>
  <p class="auth-sub">Sign in with the email and password your client gave you.</p>
  <form method="post">
    <div class="auth-field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autofocus autocomplete="username">
    </div>
    <div class="auth-field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <div class="auth-footer">
    Are you a customer instead? <a href="{{ url_for('portal.customer_login') }}">Customer portal</a>
  </div>
</div>
{% endblock %}
