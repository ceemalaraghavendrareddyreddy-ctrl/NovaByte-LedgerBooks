<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · NovaByte-LedgerBooks</title>
  <style>
    :root { --primary: #0F766E; --accent: #F97354; --accent-600: #E85A38; --bg: #F5F7FA; --text: #1F2937; --text-muted: #6B7280; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px; text-align: center;
    }
    .card { max-width: 380px; }
    .mark {
      width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-600) 100%);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 26px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: var(--primary); color: white; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    button:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">LB</div>
    <h1>You're offline</h1>
    <p>
      NovaByte-LedgerBooks needs a connection to show your live figures — invoices,
      balances and reports are never shown from a cached copy, so nothing here can
      be out of date without you knowing.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
